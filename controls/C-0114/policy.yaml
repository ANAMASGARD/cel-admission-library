apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: kubescape-c-0114-token-auth-file
  labels:
    controlId: C-0114
  annotations:
    controlUrl: https://kubescape.io/docs/controls/c-0114/
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  matchConditions:
  - name: control-plane-component
    expression: |-
      has(object.metadata.namespace) && object.metadata.namespace == 'kube-system' &&
      object.spec.containers.size() == 1 && has(object.spec.containers[0].command) &&
      object.spec.containers[0].command.size() > 0 &&
      object.spec.containers[0].command[0].endsWith('kube-apiserver')
  variables:
  - name: flags
    expression: |-
      object.spec.containers[0].command +
      (has(object.spec.containers[0].args) ? object.spec.containers[0].args : [])
  - name: values
    expression: |-
      variables.flags.filter(a, a.findAll('--token-auth-file=[^ ]+').size() > 0)
        .map(a, a.find('--token-auth-file=[^ ]+').substring(18))
  validations:
  - expression: variables.values.size() == 0
    message: Ensure that the API Server --token-auth-file parameter is not set.
