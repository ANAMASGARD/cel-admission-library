apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: "kubescape-c-0270-deny-resources-with-cpu-limit-not-set"
  labels:
    controlId: "C-0270"
  annotations:
    controlUrl: "https://kubescape.io/docs/controls/c-0270/"
spec:
  failurePolicy: Fail
  paramKind:
    apiVersion: kubescape.io/v1
    kind: ControlConfiguration
  matchConstraints:
    resourceRules:
    - apiGroups:   [""]
      apiVersions: ["v1"]
      operations:  ["CREATE", "UPDATE"]
      resources:   ["pods","pods/resize"]
    - apiGroups:   ["apps"]
      apiVersions: ["v1"]
      operations:  ["CREATE", "UPDATE"]
      resources:   ["deployments","replicasets","daemonsets","statefulsets"]
    - apiGroups:   ["batch"]
      apiVersions: ["v1"]
      operations:  ["CREATE", "UPDATE"]
      resources:   ["jobs","cronjobs"]
  variables:
    # Ephemeral containers are not included: the API does not allow resources on them.
    - expression: |
        object.kind == 'Pod'
          ? object.spec.containers + (has(object.spec.initContainers) ? object.spec.initContainers : [])
          : object.kind in ['Deployment','ReplicaSet','DaemonSet','StatefulSet','Job']
            ? object.spec.template.spec.containers + (has(object.spec.template.spec.initContainers) ? object.spec.template.spec.initContainers : [])
            : object.kind == 'CronJob'
              ? object.spec.jobTemplate.spec.template.spec.containers + (has(object.spec.jobTemplate.spec.template.spec.initContainers) ? object.spec.jobTemplate.spec.template.spec.initContainers : [])
              : []
      name: containers
    - name: bounds
      expression: >-
        params == null ? {} : params.?settings.orValue({})
  validations:
    - expression: >-
        variables.containers.all(c,
          c.?resources.?limits[?'cpu'].hasValue() &&
          (!has(variables.bounds.cpuLimitMin) ||
            quantity(string(c.resources.limits.cpu)).compareTo(quantity(string(variables.bounds.cpuLimitMin))) >= 0) &&
          (!has(variables.bounds.cpuLimitMax) ||
            quantity(string(c.resources.limits.cpu)).compareTo(quantity(string(variables.bounds.cpuLimitMax))) <= 0))
      message: Every container must set a CPU limit within the configured bounds.
