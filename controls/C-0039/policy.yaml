apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: kubescape-c-0039-review-mutatingwebhookconfigurations
  labels:
    controlId: C-0039
  annotations:
    controlUrl: https://kubescape.io/docs/controls/c-0039/
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - admissionregistration.k8s.io
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - mutatingwebhookconfigurations
  validations:
  - expression: 'false'
    message: Review this MutatingWebhookConfiguration as required by the benchmark.
