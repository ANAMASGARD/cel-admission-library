apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: kubescape-c-0303-sandbox-resource-limits
  labels:
    controlId: C-0303
  annotations:
    controlUrl: https://kubescape.io/docs/controls/c-0303/
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - extensions.agents.x-k8s.io
      apiVersions:
      - v1beta1
      operations:
      - CREATE
      - UPDATE
      resources:
      - sandboxtemplates
  variables:
  - name: containers
    expression: object.spec.?podTemplate.?spec.?containers.orValue([])
  validations:
  - expression: |-
      variables.containers.all(c, has(c.resources) && has(c.resources.limits) && has(c.resources.limits.cpu) &&
        (params == null || !has(params.settings) || !has(params.settings.sandboxCpuLimitMax) || params.settings.sandboxCpuLimitMax.size() == 0 || (isQuantity(string(c.resources.limits.cpu)) && params.settings.sandboxCpuLimitMax.all(m, isQuantity(m) &&
            quantity(string(c.resources.limits.cpu)).compareTo(quantity(m)) <= 0))))
    message: Provide a cpu limit within the configured ceiling.
  - expression: |-
      variables.containers.all(c, has(c.resources) && has(c.resources.limits) && has(c.resources.limits.memory) &&
        (params == null || !has(params.settings) || !has(params.settings.sandboxMemoryLimitMax) || params.settings.sandboxMemoryLimitMax.size() == 0 || (isQuantity(string(c.resources.limits.memory)) && params.settings.sandboxMemoryLimitMax.all(m, isQuantity(m) &&
            quantity(string(c.resources.limits.memory)).compareTo(quantity(m)) <= 0))))
    message: Provide a memory limit within the configured ceiling.
  paramKind:
    apiVersion: kubescape.io/v1
    kind: ControlConfiguration
