apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: kubescape-c-0144-terminated-pod-gc-threshold
  labels:
    controlId: C-0144
  annotations:
    controlUrl: https://kubescape.io/docs/controls/c-0144/
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  matchConditions:
  - name: control-plane-component
    expression: |-
      has(object.metadata.namespace) && object.metadata.namespace == 'kube-system' &&
      object.spec.containers.size() == 1 && has(object.spec.containers[0].command) &&
      object.spec.containers[0].command.size() > 0 &&
      object.spec.containers[0].command[0].endsWith('kube-controller-manager')
  validations:
  - expression: 'false'
    message: Ensure that the Controller Manager --terminated-pod-gc-threshold argument is set as appropriate.
