apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: kubescape-c-0149-ensure-that-the-controller-manager-rotatekubeletservercertif
  labels:
    controlId: C-0149
  annotations:
    controlUrl: https://kubescape.io/docs/controls/c-0149/
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  matchConditions:
  - name: control-plane-component
    expression: |-
      has(object.metadata.namespace) && object.metadata.namespace == 'kube-system' &&
      object.spec.containers.size() == 1 && has(object.spec.containers[0].command) &&
      object.spec.containers[0].command.size() > 0 &&
      object.spec.containers[0].command[0].endsWith('kube-controller-manager')
  variables:
  - name: flags
    expression: |-
      object.spec.containers[0].command +
      (has(object.spec.containers[0].args) ? object.spec.containers[0].args : [])
  validations:
  - expression: variables.flags.all(a, !a.contains('RotateKubeletServerCertificate=false'))
    message: Ensure that the Controller Manager RotateKubeletServerCertificate argument is set to true.
