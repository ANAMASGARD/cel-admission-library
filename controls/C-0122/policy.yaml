apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: kubescape-c-0122-ensure-that-the-admission-control-plugin-alwaysadmit-is-not
  labels:
    controlId: C-0122
  annotations:
    controlUrl: https://kubescape.io/docs/controls/c-0122/
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  matchConditions:
  - name: control-plane-component
    expression: |-
      has(object.metadata.namespace) && object.metadata.namespace == 'kube-system' &&
      object.spec.containers.size() == 1 && has(object.spec.containers[0].command) &&
      object.spec.containers[0].command.size() > 0 &&
      object.spec.containers[0].command[0].endsWith('kube-apiserver')
  variables:
  - name: flags
    expression: |-
      object.spec.containers[0].command +
      (has(object.spec.containers[0].args) ? object.spec.containers[0].args : [])
  - name: values
    expression: |-
      variables.flags.filter(a, a.findAll('--enable-admission-plugins=[^ ]+').size() == 1)
        .map(a, a.find('--enable-admission-plugins=[^ ]+').substring(27))
  validations:
  - expression: variables.values.all(v, !('AlwaysAdmit' in v.split(',')))
    message: Ensure that the admission control plugin AlwaysAdmit is not set.
