apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: "kubescape-c-0280-deny-access-to-csr-approval-subresource"
  labels:
    controlId: "C-0280"
  annotations:
    controlUrl: "https://kubescape.io/docs/controls/c-0280/"
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:   ["rbac.authorization.k8s.io"]
      apiVersions: ["v1"]
      operations:  ["CREATE", "UPDATE"]
      resources:   ["roles", "clusterroles"]
  validations:
    - expression: >
        !has(object.rules) || object.rules == null || object.rules.all(rule,
          !rule.?apiGroups.orValue([]).exists(g, g in ['certificates.k8s.io', '*']) ||
          !rule.?resources.orValue([]).exists(r, r in [
            'certificatesigningrequests/approval', '*/approval', '*',
            'certificatesigningrequests/*', '*/*']) ||
          !rule.?verbs.orValue([]).exists(v, v in ['update', 'patch', '*']))
      message: "RBAC Role or ClusterRole has access to the certificatesigningrequests/approval sub-resource which can lead to privilege escalation! (see more at https://kubescape.io/docs/controls/c-0280/)"
