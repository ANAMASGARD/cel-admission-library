apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: "kubescape-c-0055-linux-hardening"
  labels:
    controlId: "C-0055"
  annotations:
    controlUrl: "https://kubescape.io/docs/controls/c-0055/"
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:   [""]
      apiVersions: ["v1"]
      operations:  ["CREATE", "UPDATE"]
      resources:   ["pods", "pods/ephemeralcontainers"]
    - apiGroups:   ["apps"]
      apiVersions: ["v1"]
      operations:  ["CREATE", "UPDATE"]
      resources:   ["deployments","replicasets","daemonsets","statefulsets"]
    - apiGroups:   ["batch"]
      apiVersions: ["v1"]
      operations:  ["CREATE", "UPDATE"]
      resources:   ["jobs","cronjobs"]
  variables:
    - name: podSpec
      expression: >-
        object.kind == 'Pod' ? object.spec : object.kind == 'CronJob' ? object.spec.jobTemplate.spec.template.spec : object.spec.template.spec
    - name: windows
      expression: variables.podSpec.?os.?name.orValue('') == 'windows'
    - name: containers
      expression: >-
        variables.podSpec.containers + variables.podSpec.?initContainers.orValue([]) +
        variables.podSpec.?ephemeralContainers.orValue([])
    - name: podContext
      expression: variables.podSpec.?securityContext.orValue({})
    - name: annotations
      expression: >-
        object.kind == 'Pod' ? object.metadata.?annotations.orValue({}) :
        object.kind == 'CronJob' ? object.spec.jobTemplate.spec.template.?metadata.?annotations.orValue({}) :
        object.spec.template.?metadata.?annotations.orValue({})
  validations:
    - expression: >-
        variables.windows || variables.containers.all(c,
          c.?securityContext.?appArmorProfile.?type.orValue(
            variables.annotations[?('container.apparmor.security.beta.kubernetes.io/' + c.name)].orValue(
              variables.podContext.?appArmorProfile.?type.orValue('Unconfined')
            )
          ).lowerAscii() != 'unconfined' ||
          c.?securityContext.?seccompProfile.?type.orValue(
            variables.podContext.?seccompProfile.?type.orValue('Unconfined')) != 'Unconfined' ||
          c.?securityContext.?seLinuxOptions.or(variables.podContext.?seLinuxOptions).hasValue() ||
          has(c.securityContext) && has(c.securityContext.capabilities) && has(c.securityContext.capabilities.drop) && c.securityContext.capabilities.drop.size() > 0)
      message: Configure an effective Linux hardening profile for each container.
