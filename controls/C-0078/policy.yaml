apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: "kubescape-c-0078-only-allow-images-from-allowed-registry"
  labels:
    controlId: "C-0078"
  annotations:
    controlUrl: "https://kubescape.io/docs/controls/c-0078/"
spec:
  failurePolicy: Fail
  paramKind:
    apiVersion: kubescape.io/v1
    kind: ControlConfiguration
  matchConstraints:
    resourceRules:
    - apiGroups:   [""]
      apiVersions: ["v1"]
      operations:  ["CREATE", "UPDATE"]
      resources:   ["pods", "pods/ephemeralcontainers"]
    - apiGroups:   ["apps"]
      apiVersions: ["v1"]
      operations:  ["CREATE", "UPDATE"]
      resources:   ["deployments","replicasets","daemonsets","statefulsets"]
    - apiGroups:   ["batch"]
      apiVersions: ["v1"]
      operations:  ["CREATE", "UPDATE"]
      resources:   ["jobs","cronjobs"]
  variables:
    - expression: |
        object.kind == 'Pod'
          ? object.spec.containers + (has(object.spec.initContainers) ? object.spec.initContainers : []) + (has(object.spec.ephemeralContainers) ? object.spec.ephemeralContainers : [])
          : object.kind in ['Deployment','ReplicaSet','DaemonSet','StatefulSet','Job']
            ? object.spec.template.spec.containers + (has(object.spec.template.spec.initContainers) ? object.spec.template.spec.initContainers : []) + (has(object.spec.template.spec.ephemeralContainers) ? object.spec.template.spec.ephemeralContainers : [])
            : object.kind == 'CronJob'
              ? object.spec.jobTemplate.spec.template.spec.containers + (has(object.spec.jobTemplate.spec.template.spec.initContainers) ? object.spec.jobTemplate.spec.template.spec.initContainers : []) + (has(object.spec.jobTemplate.spec.template.spec.ephemeralContainers) ? object.spec.jobTemplate.spec.template.spec.ephemeralContainers : [])
              : []
      name: containers
    - name: allowed
      expression: >-
        params == null ? [] : params.?settings.?imageRepositoryAllowList.orValue([]).map(entry,
          entry.endsWith('/') ? entry.substring(0, entry.size() - 1) : entry)
    - name: normalizedImages
      expression: >-
        variables.containers.map(c, [c.image.split('/')].map(parts,
          parts.size() == 1 ? 'docker.io/library/' + c.image :
          parts[0] in ['docker.io', 'index.docker.io']
            ? 'docker.io/' + (parts.size() == 2 ? 'library/' : '') + c.image.substring(c.image.indexOf('/') + 1) :
          parts[0] == 'localhost' || parts[0].matches('[.:]') ? c.image : 'docker.io/' + c.image)[0])
  validations:
    - expression: >-
        variables.normalizedImages.all(image, variables.allowed.exists(prefix,
          prefix != '' && (image.startsWith(prefix + '/') || image == prefix ||
          image.startsWith(prefix + ':') || image.startsWith(prefix + '@'))))
      message: Every image must come from a configured registry or repository.
