apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: kubescape-c-0116-kubelet-client-certificate
  labels:
    controlId: C-0116
  annotations:
    controlUrl: https://kubescape.io/docs/controls/c-0116/
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  matchConditions:
  - name: control-plane-component
    expression: |-
      has(object.metadata.namespace) && object.metadata.namespace == 'kube-system' &&
      object.spec.containers.size() == 1 && has(object.spec.containers[0].command) &&
      object.spec.containers[0].command.size() > 0 &&
      object.spec.containers[0].command[0].endsWith('kube-apiserver')
  variables:
  - name: flags
    expression: |-
      object.spec.containers[0].command +
      (has(object.spec.containers[0].args) ? object.spec.containers[0].args : [])
  validations:
  - expression: |-
      variables.flags.exists(a, a.contains('--kubelet-client-certificate')) &&
      variables.flags.exists(a, a.contains('--kubelet-client-key'))
    message: Ensure that the API Server --kubelet-client-certificate and --kubelet-client-key arguments are set
      as appropriate.
