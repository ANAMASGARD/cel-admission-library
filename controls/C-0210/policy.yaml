apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: "kubescape-c-0210-deny-seccomp-profile-unconfined"
  labels:
    controlId: "C-0210"
  annotations:
    controlUrl: "https://kubescape.io/docs/controls/c-0210/"
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:   [""]
      apiVersions: ["v1"]
      operations:  ["CREATE", "UPDATE"]
      resources:   ["pods", "pods/ephemeralcontainers"]
    - apiGroups:   ["apps"]
      apiVersions: ["v1"]
      operations:  ["CREATE", "UPDATE"]
      resources:   ["deployments","replicasets","daemonsets","statefulsets"]
    - apiGroups:   ["batch"]
      apiVersions: ["v1"]
      operations:  ["CREATE", "UPDATE"]
      resources:   ["jobs","cronjobs"]
  variables:
    - name: podSpec
      expression: >-
        object.kind == 'Pod' ? object.spec : object.kind == 'CronJob' ? object.spec.jobTemplate.spec.template.spec : object.spec.template.spec
    - name: windows
      expression: variables.podSpec.?os.?name.orValue('') == 'windows'
    - name: containers
      expression: >-
        variables.podSpec.containers + variables.podSpec.?initContainers.orValue([]) +
        variables.podSpec.?ephemeralContainers.orValue([])
  validations:
    - expression: >-
        variables.windows || variables.containers.all(c,
          c.?securityContext.?seccompProfile.?type.orValue(
            variables.podSpec.?securityContext.?seccompProfile.?type.orValue('Unconfined')) == 'RuntimeDefault')
      messageExpression: >
        object.kind + '/' + object.metadata.name + ' has a container with seccomp profile other than RuntimeDefault. (see more at https://kubescape.io/docs/controls/c-0210/)'
