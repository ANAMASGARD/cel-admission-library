apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: kubescape-c-0119-authorization-mode
  labels:
    controlId: C-0119
  annotations:
    controlUrl: https://kubescape.io/docs/controls/c-0119/
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  matchConditions:
  - name: control-plane-component
    expression: |-
      has(object.metadata.namespace) && object.metadata.namespace == 'kube-system' &&
      object.spec.containers.size() == 1 && has(object.spec.containers[0].command) &&
      object.spec.containers[0].command.size() > 0 &&
      object.spec.containers[0].command[0].endsWith('kube-apiserver')
  variables:
  - name: flags
    expression: |-
      object.spec.containers[0].command +
      (has(object.spec.containers[0].args) ? object.spec.containers[0].args : [])
  - name: values
    expression: |-
      variables.flags.filter(a, a.findAll('--authorization-mode=[^ ]+').size() == 1)
        .map(a, a.find('--authorization-mode=[^ ]+').substring(21))
  validations:
  - expression: |-
      variables.flags.exists(a, a.contains('--authorization-mode')) &&
      variables.values.all(v, 'Node' in v.split(','))
    message: Ensure that the API Server --authorization-mode argument includes Node.
