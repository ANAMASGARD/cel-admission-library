apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: "kubescape-c-0012-deny-resources-with-sensitive-information-in-environment-variables"
  labels:
    controlId: "C-0012"
  annotations:
    controlUrl: "https://kubescape.io/docs/controls/c-0012/"
spec:
  failurePolicy: Fail
  paramKind:
    apiVersion: kubescape.io/v1
    kind: ControlConfiguration
  matchConstraints:
    resourceRules:
    - apiGroups:   [""]
      apiVersions: ["v1"]
      operations:  ["CREATE", "UPDATE"]
      resources:   ["pods", "pods/ephemeralcontainers"]
    - apiGroups:   ["apps"]
      apiVersions: ["v1"]
      operations:  ["CREATE", "UPDATE"]
      resources:   ["deployments","replicasets","daemonsets","statefulsets"]
    - apiGroups:   ["batch"]
      apiVersions: ["v1"]
      operations:  ["CREATE", "UPDATE"]
      resources:   ["jobs","cronjobs"]
    - apiGroups:   [""]
      apiVersions: ["v1"]
      operations:  ["CREATE", "UPDATE"]
      resources:   ["configmaps"]
  variables:
    - expression: |
        object.kind == 'Pod'
          ? object.spec.containers + (has(object.spec.initContainers) ? object.spec.initContainers : []) + (has(object.spec.ephemeralContainers) ? object.spec.ephemeralContainers : [])
          : object.kind in ['Deployment','ReplicaSet','DaemonSet','StatefulSet','Job']
            ? object.spec.template.spec.containers + (has(object.spec.template.spec.initContainers) ? object.spec.template.spec.initContainers : []) + (has(object.spec.template.spec.ephemeralContainers) ? object.spec.template.spec.ephemeralContainers : [])
            : object.kind == 'CronJob'
              ? object.spec.jobTemplate.spec.template.spec.containers + (has(object.spec.jobTemplate.spec.template.spec.initContainers) ? object.spec.jobTemplate.spec.template.spec.initContainers : []) + (has(object.spec.jobTemplate.spec.template.spec.ephemeralContainers) ? object.spec.jobTemplate.spec.template.spec.ephemeralContainers : [])
              : []
      name: containers
  validations:
    - expression: |
        variables.containers.all(c, !has(c.env) || c.env.all(e,
          !has(e.value) || e.value == '' || e.value.startsWith('/') ||
          params.settings.sensitiveKeyNamesAllowed.exists(k, e.name.lowerAscii().contains(k.lowerAscii())) ||
          params.settings.sensitiveValuesAllowed.exists(v, v != '' && e.value.matches(v)) ||
          (!params.settings.sensitiveKeyNames.exists(k, e.name.lowerAscii().contains(k.lowerAscii())) &&
           !params.settings.sensitiveValues.exists(v, e.value.matches('(?i)' + v)))
        ))
      reason: Invalid
      message: A container environment variable contains sensitive information.
    - expression: |
        object.kind != 'ConfigMap' || !has(object.data) || object.data.all(k,
          object.data[k] == '' ||
          params.settings.sensitiveKeyNamesAllowed.exists(a, k.lowerAscii().contains(a.lowerAscii())) ||
          params.settings.sensitiveValuesAllowed.exists(v, v != '' && object.data[k].matches(v)) ||
          (!params.settings.sensitiveKeyNames.exists(a, k.lowerAscii().contains(a.lowerAscii())) &&
           !params.settings.sensitiveValues.exists(v, object.data[k].matches(v)))
        )
      message: The ConfigMap contains sensitive information.
