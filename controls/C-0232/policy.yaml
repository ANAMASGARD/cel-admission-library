apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: kubescape-c-0232-review-roles
  labels:
    controlId: C-0232
  annotations:
    controlUrl: https://kubescape.io/docs/controls/c-0232/
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - rbac.authorization.k8s.io
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - roles
  validations:
  - expression: 'false'
    message: Review this Role as required by the benchmark.
