apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: "kubescape-c-0001-deny-forbidden-container-registries"
  labels:
    controlId: "C-0001"
  annotations:
    controlUrl: "https://kubescape.io/docs/controls/c-0001/"
spec:
  failurePolicy: Fail
  paramKind:
    apiVersion: kubescape.io/v1
    kind: ControlConfiguration
  matchConstraints:
    resourceRules:
    - apiGroups:   [""]
      apiVersions: ["v1"]
      operations:  ["CREATE", "UPDATE"]
      resources:   ["pods", "pods/ephemeralcontainers"]
    - apiGroups:   ["apps"]
      apiVersions: ["v1"]
      operations:  ["CREATE", "UPDATE"]
      resources:   ["deployments","replicasets","daemonsets","statefulsets"]
    - apiGroups:   ["batch"]
      apiVersions: ["v1"]
      operations:  ["CREATE", "UPDATE"]
      resources:   ["jobs","cronjobs"]
  variables:
    - expression: |
        object.kind == 'Pod'
          ? object.spec.containers + (has(object.spec.initContainers) ? object.spec.initContainers : []) + (has(object.spec.ephemeralContainers) ? object.spec.ephemeralContainers : [])
          : object.kind in ['Deployment','ReplicaSet','DaemonSet','StatefulSet','Job']
            ? object.spec.template.spec.containers + (has(object.spec.template.spec.initContainers) ? object.spec.template.spec.initContainers : []) + (has(object.spec.template.spec.ephemeralContainers) ? object.spec.template.spec.ephemeralContainers : [])
            : object.kind == 'CronJob'
              ? object.spec.jobTemplate.spec.template.spec.containers + (has(object.spec.jobTemplate.spec.template.spec.initContainers) ? object.spec.jobTemplate.spec.template.spec.initContainers : []) + (has(object.spec.jobTemplate.spec.template.spec.ephemeralContainers) ? object.spec.jobTemplate.spec.template.spec.ephemeralContainers : [])
              : []
      name: containers
    - name: forbidden
      expression: >-
        params == null ? [] :
        params.?settings.?untrustedRegistries.orValue([]) + params.?settings.?publicRegistries.orValue([])
    - name: images
      expression: >-
        variables.containers.map(c, c.image.lowerAscii())
    - name: canonicalImages
      expression: >-
        variables.images.map(img,
          !img.contains('/') ? 'docker.io/library/' + img :
          img.matches('^(docker[.]io|index[.]docker[.]io|registry-1[.]docker[.]io)/')
            ? 'docker.io/' + (img.split('/').size() == 2 ? 'library/' : '') +
              img.substring(img.indexOf('/') + 1) :
          img.split('/')[0] == 'localhost' || img.split('/')[0].matches('[.:]') ? img :
          'docker.io/' + img)
  validations:
    - expression: >-
        variables.canonicalImages.all(img, variables.forbidden.all(entry,
          [(entry.endsWith('/') ? entry.substring(0, entry.size() - 1) : entry).lowerAscii()].all(prefix,
            !(prefix in ['index.docker.io', 'registry-1.docker.io'] && img.startsWith('docker.io/')) &&
            !img.startsWith(prefix + '/') &&
            !(img == prefix || img.startsWith(prefix + ':') || img.startsWith(prefix + '@')))))
      message: An image uses a forbidden registry or repository.
