apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: "kubescape-c-0013-deny-resources-with-capability-to-run-as-root"
  labels:
    controlId: "C-0013"
  annotations:
    controlUrl: "https://kubescape.io/docs/controls/c-0013/"
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:   [""]
      apiVersions: ["v1"]
      operations:  ["CREATE", "UPDATE"]
      resources:   ["pods", "pods/ephemeralcontainers"]
    - apiGroups:   ["apps"]
      apiVersions: ["v1"]
      operations:  ["CREATE", "UPDATE"]
      resources:   ["deployments","replicasets","daemonsets","statefulsets"]
    - apiGroups:   ["batch"]
      apiVersions: ["v1"]
      operations:  ["CREATE", "UPDATE"]
      resources:   ["jobs","cronjobs"]
  variables:
    - name: podSpec
      expression: >-
        object.kind == 'Pod' ? object.spec : object.kind == 'CronJob' ? object.spec.jobTemplate.spec.template.spec : object.spec.template.spec
    - name: podContext
      expression: variables.podSpec.?securityContext.orValue({})
    - name: containers
      expression: >-
        variables.podSpec.containers + variables.podSpec.?initContainers.orValue([]) +
        variables.podSpec.?ephemeralContainers.orValue([])
  validations:
    - expression: >-
        variables.containers.all(c,
          (c.?securityContext.?runAsNonRoot.orValue(variables.podContext.?runAsNonRoot.orValue(false)) ||
           c.?securityContext.?runAsUser.orValue(variables.podContext.?runAsUser.orValue(0)) != 0) &&
          (variables.podSpec.?os.?name.orValue('') == 'windows' ||
           c.?securityContext.?runAsGroup.orValue(variables.podContext.?runAsGroup.orValue(0)) != 0))
      message: Containers must have an effective non-root user and, on Linux, non-root group.
