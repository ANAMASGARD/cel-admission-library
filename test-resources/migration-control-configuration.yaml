apiVersion: kubescape.io/v1
kind: ControlConfiguration
metadata:
  name: placeholder
settings:
  imageRepositoryAllowList:
  - docker.io
  - gcr.io
  floatingImageTags:
  - stable
  imageDigestExemptRepositories:
  - registry.example/team
  agentSandboxEgressMode:
  - strict
  workerCpuLimitMax:
  - '1'
  workerMemoryLimitMax:
  - 256Mi
  sandboxCpuLimitMax:
  - '1'
  sandboxMemoryLimitMax:
  - 256Mi
