apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../controls
- ../../runtime-policies
patches:
- target:
    group: admissionregistration.k8s.io
    version: v1
    kind: ValidatingAdmissionPolicy
    labelSelector: controlId,controlId notin (C-0005,C-0018,C-0026,C-0034,C-0036,C-0038,C-0039,C-0041,C-0042,C-0048,C-0056,C-0061,C-0073,C-0074,C-0076,C-0077,C-0087,C-0132,C-0133,C-0144,C-0196,C-0199,C-0200,C-0201,C-0203,C-0209,C-0212,C-0225,C-0226,C-0231,C-0232,C-0239,C-0262,C-0263,C-0273,C-0297,C-0301,C-0305,C-0309,C-0311,C-0312,C-0313,C-0314,C-0315,C-0316)
  patch: |
    $patch: delete
    apiVersion: admissionregistration.k8s.io/v1
    kind: ValidatingAdmissionPolicy
    metadata:
      name: unused
- target:
    group: admissionregistration.k8s.io
    version: v1
    kind: ValidatingAdmissionPolicy
    name: cluster-policy-deny-insecure-capabilities
